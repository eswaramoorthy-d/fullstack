<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        .products {
            display: flex;
            gap: 20px;
        }

        .product {
            width: 200px;
            padding: 15px;
            border: 1px solid #ccc;
            text-align: center;
        }

        .product img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        .cart {
            margin-top: 30px;
            padding: 20px;
            border: 2px solid black;
        }

        .cart-item {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }

        .remove {
            background: red;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Online Shopping</h1>

    <div class="products">

        <div class="product">
            <img src="https://www.sathya.store/img/product/Z42Pwk5AujGm0n4I.jpg" alt="Mobile">
            <p>Mobile</p>
            <h2>Rs 12000</h2>

            <button onclick="addToCart('Mobile', 12000)">
                Add To Cart
            </button>
        </div>

        <div class="product">
            <img src="https://www.sathya.store/img/product/Z42Pwk5AujGm0n4I.jpg" alt="Headset">
            <p>Headset</p>
            <h2>Rs 2000</h2>

            <button onclick="addToCart('Headset', 2000)">
                Add To Cart
            </button>
        </div>

    </div>


    <div class="cart">

        <h2>Shopping Cart</h2>

        <div id="cartItems"></div>

        <h3 id="total">Total: Rs 0</h3>

    </div>


    <script>

        // Empty cart
        let cart = [];


        // Add product to cart
        function addToCart(product, price) {

            // Check whether product already exists
            let existingProduct = cart.find(item => item.product === product);

            if (existingProduct) {

                existingProduct.quantity++;

            } else {

                cart.push({
                    product: product,
                    price: price,
                    quantity: 1
                });

            }

            displayCart();
        }


        // Display cart
        function displayCart() {

            let cartItems = document.getElementById("cartItems");

            cartItems.innerHTML = "";

            let total = 0;


            cart.forEach((item, index) => {

                let itemTotal = item.price * item.quantity;

                total += itemTotal;


                cartItems.innerHTML += `
                    <div class="cart-item">

                        <h3>${item.product}</h3>

                        <p>Price: Rs ${item.price}</p>

                        <p>Quantity: ${item.quantity}</p>

                        <p>Subtotal: Rs ${itemTotal}</p>

                        <button class="remove"
                            onclick="removeFromCart(${index})">
                            Remove
                        </button>

                    </div>
                `;

            });


            document.getElementById("total").innerText =
                "Total: Rs " + total;
        }


        // Remove product
        function removeFromCart(index) {

            cart.splice(index, 1);

            displayCart();
        }

    </script>

</body>
</html>
